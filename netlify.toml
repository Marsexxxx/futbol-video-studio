[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[edge_functions]]
  path = "/api/generate-video"
  function = "generate-video"

[[edge_functions]]
  path = "/api/generate-tts"
  function = "generate-tts"

[[edge_functions]]
  path = "/api/generate-image"
  function = "generate-image"

[[edge_functions]]
  path = "/api/export-video"
  function = "export-video"

[[edge_functions]]
  path = "/api/export-status"
  function = "export-status"

[dev]
  command = "npm run dev"
  targetPort = 5173
