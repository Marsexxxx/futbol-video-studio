[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[edge_functions]]
  path = "/api/generate-video"
  function = "generate-video"

[[edge_functions]]
  path = "/api/generate-tts"
  function = "generate-tts"

[dev]
  command = "npm run dev"
  targetPort = 5173
